name: Nexus Intelligence Lab (experimental)
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Public GitHub repository (owner/name)'
        required: true
        default: 'janus-llm/janus-llm'
      model:
        description: 'Exact model ID supported by provider'
        required: true
        default: 'free/glm-5.3-flash'
permissions:
  contents: write
concurrency:
  group: intelligence-publish
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXUS_API_BASE: https://api.apinex.bond/v1
      NEXUS_API_KEY: ${{ secrets.NEXUS_LLM_API_KEY }}
      NEXUS_MODEL: ${{ inputs.model }}
      TARGET_REPO: ${{ inputs.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate input and credentials
        shell: bash
        run: |
          test -n "$NEXUS_API_KEY" || { echo "::error::Missing NEXUS_LLM_API_KEY secret"; exit 1; }
          python - <<'PY'
          import os,re
          target=os.environ["TARGET_REPO"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+",target):
              raise SystemExit("Invalid public GitHub owner/name")
          if not re.fullmatch(r"[A-Za-z0-9_.:/-]{1,100}",os.environ["NEXUS_MODEL"]):
              raise SystemExit("Invalid model ID")
          PY
      - name: Check Python syntax before API requests
        run: python -m py_compile janus-worker/multi_analyze.py
      - name: Run offline guardrail tests
        run: python -m unittest discover -s janus-worker -p 'test_*.py' -v
      - name: Check dashboard script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("intelligence.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/nexus-intelligence.cjs").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/nexus-intelligence.cjs
      - name: Smoke test dashboard with schema v1 and v2
        run: node janus-worker/test_ui.cjs
      - name: Analyze up to three public source files
        run: python janus-worker/multi_analyze.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nexus-intelligence-report
          path: janus-worker/output/report.json
          retention-days: 7

      - name: Publish successful report to Intelligence Lab
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("janus-worker/output/report.json")
          report=json.loads(path.read_text(encoding="utf-8"))
          assert report.get("schema")==2
          assert report.get("verified") is False
          assert 1<=len(report.get("files",[]))<=3
          target=Path("data/intelligence/latest.json")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Validated report ready for publication as unverified AI analysis.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intelligence/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish latest Intelligence Lab report [skip ci]"
            git push origin HEAD:main
          fi
          git fetch origin gh-pages
          git worktree add --detach /tmp/unrepo-intelligence-publish origin/gh-pages
          mkdir -p /tmp/unrepo-intelligence-publish/data/intelligence
          cp data/intelligence/latest.json /tmp/unrepo-intelligence-publish/data/intelligence/latest.json
          cd /tmp/unrepo-intelligence-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intelligence/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "publish: update Intelligence Lab report [skip ci]"
            git push origin HEAD:refs/heads/gh-pages
          fi
