name: Refresh GitHub resource metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/refresh_metadata.py'
      - '.github/workflows/refresh-repo-metadata.yml'
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
concurrency:
  group: resource-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh cache from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_metadata.py
      - name: Commit updated cache
        run: |
          if git diff --quiet -- data/github-metadata.json; then
            echo "No metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-metadata.json
          git commit -m "data: refresh GitHub repository metadata [skip ci]"
          git push
