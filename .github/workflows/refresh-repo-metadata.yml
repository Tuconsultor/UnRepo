name: Refresh GitHub resource metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'rea-roadmap.html'
      - 'intelligence.html'
      - 'resiliencia-agentes.html'
      - 'soporte-remoto-windows.html'
      - 'silicon-lab.html'
      - 'space-lab.html'
      - 'assets/social/unrepo-icon-2026.png'
      - 'scripts/validate_nexus.py'
      - 'scripts/refresh_metadata.py'
      - 'scripts/refresh_discovery.py'
      - '.github/workflows/refresh-repo-metadata.yml'
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: write
concurrency:
  group: resource-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Nexus pages and JavaScript
        run: python scripts/validate_nexus.py
      - name: Refresh cache from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_metadata.py
      - name: Stage candidates from reverse-engineering directory
        run: python scripts/refresh_discovery.py || echo 'Discovery source unavailable; retaining last shortlist'
      - name: Commit updated cache
        run: |
          if git diff --quiet -- data/github-metadata.json data/discovery-candidates.json; then
            echo "No metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-metadata.json data/discovery-candidates.json
          git commit -m "data: refresh GitHub repository metadata [skip ci]"
          git push
      - name: Publish Nexus to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add --detach /tmp/unrepo-nexus-gh-pages FETCH_HEAD
          mkdir -p /tmp/unrepo-nexus-gh-pages/data /tmp/unrepo-nexus-gh-pages/assets/social
          cp index.html /tmp/unrepo-nexus-gh-pages/index.html
          cp rea-roadmap.html /tmp/unrepo-nexus-gh-pages/rea-roadmap.html
          cp intelligence.html /tmp/unrepo-nexus-gh-pages/intelligence.html
          cp resiliencia-agentes.html /tmp/unrepo-nexus-gh-pages/resiliencia-agentes.html
          cp soporte-remoto-windows.html /tmp/unrepo-nexus-gh-pages/soporte-remoto-windows.html
          cp silicon-lab.html /tmp/unrepo-nexus-gh-pages/silicon-lab.html
          cp space-lab.html /tmp/unrepo-nexus-gh-pages/space-lab.html
          cp assets/social/unrepo-icon-2026.png /tmp/unrepo-nexus-gh-pages/assets/social/unrepo-icon-2026.png
          cp data/github-metadata.json /tmp/unrepo-nexus-gh-pages/data/github-metadata.json
          cp data/discovery-candidates.json /tmp/unrepo-nexus-gh-pages/data/discovery-candidates.json
          cd /tmp/unrepo-nexus-gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rea-roadmap.html intelligence.html resiliencia-agentes.html soporte-remoto-windows.html silicon-lab.html space-lab.html assets/social/unrepo-icon-2026.png data/github-metadata.json data/discovery-candidates.json
          if git diff --cached --quiet; then
            echo "No website changes to publish"
          else
            git commit -m "publish: sync Nexus catalog and metadata [skip ci]"
            git push origin HEAD:refs/heads/gh-pages
          fi

